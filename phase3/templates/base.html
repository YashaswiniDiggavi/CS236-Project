<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}311 Service Requests{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2430; --muted: #5f6b7a;
    --line: #dde2e8; --zebra: #f1f4f8; --accent: #1f5fbf; --accent-text: #ffffff;
    --ok-bg: #e6f4ea; --ok-text: #14532d;
    --warn-bg: #fff4d6; --warn-text: #6b4e00;
    --err-bg: #fde8e8; --err-text: #7f1d1d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181f; --card: #1c222b; --text: #e6e9ee; --muted: #9aa5b4;
      --line: #2e3744; --zebra: #202732; --accent: #5b9dff; --accent-text: #0b1220;
      --ok-bg: #12301d; --ok-text: #b7e4c7;
      --warn-bg: #3a2f0b; --warn-text: #f5d77a;
      --err-bg: #3d1717; --err-text: #f5b5b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1200px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
  header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding-top: 12px; padding-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { margin: 0; color: var(--muted); font-size: 13px; }
  nav.main a { margin-left: 16px; color: var(--muted); text-decoration: none; font-weight: 600; padding-bottom: 4px; }
  nav.main a.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
  main { padding-top: 20px; padding-bottom: 40px; }
  a { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tabs a { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--text); text-decoration: none; font-weight: 600; }
  .tabs a.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 12px 16px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
  input, select { font: inherit; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); width: 100%; }
  .actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
  button, .button { font: inherit; font-weight: 600; padding: 8px 18px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-text); cursor: pointer; text-decoration: none; }
  .button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .notice { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
  .notice.ok { background: var(--ok-bg); color: var(--ok-text); }
  .notice.warn { background: var(--warn-bg); color: var(--warn-text); }
  .notice.error { background: var(--err-bg); color: var(--err-text); }
  .notice ul { margin: 0; padding-left: 20px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--zebra); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  tbody tr:nth-child(even) { background: var(--zebra); }
  .summary { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0 10px; color: var(--muted); }
  .pager { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  .pager .disabled { color: var(--muted); opacity: .6; }
  details { margin-top: 16px; }
  summary { cursor: pointer; font-weight: 600; color: var(--muted); }
  pre { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; }
  .hint { font-weight: 400; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <h1>311 Service Requests</h1>
      <p class="sub">NYC 311 and LA MyLA311 &middot; CS236 Phase 3</p>
    </div>
    <nav class="main">
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Browse</a>
      <a href="{{ url_for('new_request') }}" class="{{ 'active' if request.endpoint == 'new_request' }}">New request</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
